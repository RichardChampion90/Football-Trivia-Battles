<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0c1424"><title>Football Trivia Battles — V0.2</title><style>
:root{color-scheme:dark;--bg:#0b1321;--panel:#152238;--card:#1b2b43;--line:#34425a;--text:#f7f9fc;--muted:#afbed3;--gold:#ffcf5c;--green:#46d69f;--red:#f47b85}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:radial-gradient(ellipse at top,#223853 0%,var(--bg) 62%);color:var(--text);min-height:100vh}button,input{font:inherit}button{cursor:pointer;border:none}button:disabled{cursor:not-allowed;opacity:.48}.app{max-width:650px;margin:auto;padding:18px 15px 50px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:6px 0 20px}.brand{font-size:15px;font-weight:900;letter-spacing:.06em}.sub{font-size:12px;color:var(--muted);margin-top:4px}.pill{background:#273b55;border:1px solid #3d5570;border-radius:999px;padding:8px 11px;font-weight:800;font-size:13px;white-space:nowrap}.box{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:19px;margin-bottom:14px;box-shadow:0 8px 25px #0002}.hero{font-size:34px;line-height:1.1;margin:8px 0 14px}.lede{color:var(--muted);line-height:1.5}.statrow{display:flex;gap:8px;margin:19px 0}.stat{flex:1;background:var(--card);padding:13px 8px;border-radius:12px;text-align:center}.stat b{display:block;font-size:22px}.stat small{color:var(--muted)}.btn{width:100%;background:var(--gold);color:#141c2b;font-weight:900;border-radius:12px;padding:14px 16px;margin-top:11px;min-height:48px}.secondary{background:var(--card);border:1px solid var(--line);color:var(--text)}.tiny{font-size:12px;color:var(--muted);line-height:1.55}.meta{display:flex;align-items:center;justify-content:space-between;gap:8px}.kicker{color:var(--gold);font-weight:850;font-size:12px;letter-spacing:.08em;text-transform:uppercase}.bar{height:9px;background:#28364b;border-radius:50px;overflow:hidden;margin:15px 0 18px}.fill{background:linear-gradient(90deg,#31c594,#ffe082);height:100%;transition:width .25s}.q{font-size:21px;line-height:1.35;margin:13px 0}.inputs{display:flex;gap:9px;margin:14px 0 8px}.field{min-width:0;flex:1;background:#101b2c;border:1px solid #65758e;color:white;border-radius:12px;padding:12px 13px;min-height:46px}.mini{background:var(--gold);font-weight:850;border-radius:12px;padding:12px 15px;color:#152034}.notice{padding:11px 12px;margin:9px 0;background:#263850;border-radius:10px;color:#f3f6fa;font-size:14px}.notice.success{background:#164c3e;color:#b3ffe1}.notice.error{background:#572c39;color:#ffd0d3}.grid10{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:14px 0}.slot{background:#1a2a3f;border:1px solid #35455d;border-radius:10px;padding:11px 8px;font-size:13px;min-height:43px}.slot.found{background:#184637;border-color:#358a6a;color:#c9ffe8}.choices{display:grid;gap:9px;margin:16px 0}.choice{background:#1e3048;border:1px solid #445876;color:white;text-align:left;border-radius:12px;padding:14px;min-height:47px}.choice.active{border-color:var(--gold);background:#4a3c2b}.choice.correct{background:#174734;border-color:#38bf83}.clue{background:#20334e;padding:13px;border-radius:11px;margin:9px 0;line-height:1.45}.clue small{display:block;color:var(--gold);font-weight:800;margin-bottom:4px}.row{display:flex;gap:8px;align-items:center;justify-content:space-between}.chip{color:#ffe19a;background:#493d25;padding:7px 9px;border-radius:8px;font-size:12px;font-weight:750}.resultline{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:12px 0}.resultline:last-child{border:0}.score{font-size:57px;font-weight:900;color:var(--gold);line-height:1.15;margin:8px 0}.hidden{display:none!important}.muted{color:var(--muted)}.footer{color:var(--muted);text-align:center;font-size:11px;margin-top:25px}.roundhead{font-weight:800;margin-top:14px}.shake{animation:shake .25s}@keyframes shake{25%{transform:translateX(3px)}75%{transform:translateX(-3px)}}
</style></head><body><main class="app"><header class="top"><div><div class="brand">⚽ FOOTBALL TRIVIA BATTLES</div><div class="sub">V0.2 · 21-answer gameplay prototype</div></div><div class="pill" id="clock">10:00</div></header><div id="screen"></div><div class="footer">Sample historical football questions · Local demo only · No account or live league yet</div></main><script>
'use strict';
const ROUNDS=['Top Ten','Transfer Trail','Stat Attack','Mystery Player','Odd One Out'];
const MAX=[30,20,15,20,15];
const topNames=['Alan Shearer','Harry Kane','Wayne Rooney','Andrew Cole','Sergio Agüero','Frank Lampard','Thierry Henry','Robbie Fowler','Jermain Defoe','Michael Owen'];
const trail=[{answer:'Eden Hazard',alternatives:['Hazard'],clues:['I played senior football in France, England and Spain.','I played for Lille before joining a London club.','I moved from Chelsea to Real Madrid in 2019.']},{answer:'Kevin De Bruyne',alternatives:['De Bruyne','KDB'],clues:['I have played professional football in Belgium, England and Germany.','My clubs included Genk, Chelsea and Wolfsburg.','I joined Manchester City in 2015.']},{answer:'Zlatan Ibrahimović',alternatives:['Zlatan','Ibrahimovic'],clues:['I played for multiple clubs in Italy, and also in Spain and France.','I represented Ajax, Juventus, Inter and Barcelona.','I later played for PSG, Manchester United and LA Galaxy.']}];
const stat=[{q:'Which team won the 2015/16 Premier League title?',options:['Arsenal','Leicester City','Tottenham Hotspur','Chelsea'],a:1},{q:'Who scored the decisive stoppage-time goal against QPR to give Manchester City the 2011/12 Premier League title?',options:['Edin Džeko','Carlos Tévez','Sergio Agüero','David Silva'],a:2},{q:'Which team completed the 2003/04 Premier League season unbeaten?',options:['Chelsea','Manchester United','Liverpool','Arsenal'],a:3}];
const mystery=[{answer:'N’Golo Kanté',alternatives:['Kante','N Golo Kante'],clues:['I am a French international midfielder.','I won back-to-back Premier League titles with different clubs.','My first Premier League club was Leicester City.','I then joined Chelsea.','I won the 2018 World Cup with France.']},{answer:'Luka Modrić',alternatives:['Modric','Luka Modric'],clues:['I am a European international midfielder.','I won the Ballon d’Or in 2018.','I played in the Premier League before moving to La Liga.','My English club was Tottenham Hotspur.','My Spanish club was Real Madrid.']}];
const odd=[{q:'Which of these players has never won the men’s Ballon d’Or?',options:['Luka Modrić','Karim Benzema','Neymar','Kaká'],a:2},{q:'Which of these players did NOT play a senior competitive match for Chelsea?',options:['Juan Mata','Mohamed Salah','Kevin De Bruyne','Steven Gerrard'],a:3},{q:'Which of these clubs has NOT won the UEFA Champions League / European Cup?',options:['Nottingham Forest','Aston Villa','Arsenal','Porto'],a:2}];
const norm=s=>s.toLocaleLowerCase('en').normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');
const same=(input,name,aliases=[])=>[name,...aliases].some(x=>norm(x)===norm(input));
const el=document.getElementById('screen'),clock=document.getElementById('clock');
let state={mode:'home',round:0,score:[0,0,0,0,0],top:[],wrong:0,step:0,sub:0,level:0,answers:[],choice:-1,feedback:'',timeEnd:null,finished:false,results:[],misses:0};
const maxTime=600000;
function persist(){try{localStorage.setItem('ftb_v02',JSON.stringify(state));}catch{}}
function load(){try{const s=JSON.parse(localStorage.getItem('ftb_v02'));if(s&&s.mode&&Array.isArray(s.score))state=s;}catch{}}
function escapeHtml(str){return String(str).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function remaining(){return state.timeEnd===null?600:Math.max(0,Math.ceil((state.timeEnd-Date.now())/1000));}
function renderClock(){const s=remaining();clock.textContent=`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;clock.style.color=s<=60?'#ff8a90':'';if(s===0&&state.mode==='play')finish(true);}
function render(){renderClock();if(state.mode==='home')return showHome();if(state.mode==='done')return showResults();const r=state.round;let html=`<section class="box"><div class="meta"><div class="kicker">Round ${r+1} of 5 · ${ROUNDS[r]}</div><div class="chip">${state.score[r]}/${MAX[r]} pts</div></div><div class="bar"><div class="fill" style="width:${r*20}%"></div></div>`;
if(r===0)html+=topHtml();if(r===1)html+=trailHtml();if(r===2)html+=statHtml();if(r===3)html+=mysteryHtml();if(r===4)html+=oddHtml();html+='</section>';el.innerHTML=html;const input=document.getElementById('typed');if(input){input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();handleSubmit();}});}
}
function showHome(){el.innerHTML=`<section class="box"><div class="kicker">Ready for kick-off?</div><h1 class="hero">Prove your football knowledge.</h1><p class="lede">Five rounds. Twenty-one answers. One ten-minute battle. Score up to 100 points and see how you would perform in a league.</p><div class="statrow"><div class="stat"><b>5</b><small>Rounds</small></div><div class="stat"><b>21</b><small>Answers</small></div><div class="stat"><b>100</b><small>Points</small></div></div><p class="tiny">This is a sample battle. The timer begins when you press Start. Answers lock after submission; you cannot return to completed rounds.</p><button class="btn" onclick="start()">Start sample battle →</button></section>`;}
function topHtml(){return `<h2 class="q">Name the ten highest all-time Premier League goalscorers <span class="muted">at the end of the 2022/23 season</span>.</h2><div class="tiny">Any order · 3 points per answer · Three incorrect guesses allowed · 3-minute suggested pace.</div><div class="grid10">${topNames.map((n,i)=>`<div class="slot ${state.top.includes(i)?'found':''}">${i+1}. ${state.top.includes(i)?escapeHtml(n):'??????????'}</div>`).join('')}</div><div class="row"><span class="tiny">Found: ${state.top.length}/10</span><span class="tiny">Incorrect: ${state.wrong}/3</span></div>${state.feedback?`<div class="notice ${state.feedback.startsWith('Correct')?'success':'error'}">${escapeHtml(state.feedback)}</div>`:''}<div class="inputs"><input id="typed" class="field" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="Footballer’s name"><button class="mini" onclick="handleSubmit()">Enter</button></div><button class="btn secondary" onclick="nextRound()">Finish Top Ten →</button>`;}
function trailHtml(){const x=trail[state.sub];return `<div class="meta"><span class="tiny">Player ${state.sub+1} of 3</span><span class="chip">${[6,4,2][state.level]} points available</span></div><h2 class="q">Who is this footballer?</h2>${x.clues.slice(0,state.level+1).map((c,i)=>`<div class="clue"><small>Clue ${i+1}</small>${escapeHtml(c)}</div>`).join('')}${state.feedback?`<div class="notice error">${escapeHtml(state.feedback)}</div>`:''}<div class="inputs"><input id="typed" class="field" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="Player’s name"><button class="mini" onclick="handleSubmit()">Lock in</button></div><button class="btn secondary" onclick="reveal()" ${state.level>=2?'disabled':''}>Reveal next clue (−2 pts)</button><button class="btn secondary" onclick="skip()">Skip player →</button>`;}
function statHtml(){const x=stat[state.sub];return `<div class="meta"><span class="tiny">Question ${state.sub+1} of 3</span><span class="chip">5 pts</span></div><h2 class="q">${escapeHtml(x.q)}</h2><div class="choices">${x.options.map((o,i)=>`<button class="choice ${state.choice===i?'active':''}" onclick="selectChoice(${i})">${String.fromCharCode(65+i)}. ${escapeHtml(o)}</button>`).join('')}</div><button class="btn" onclick="handleSubmit()" ${state.choice===-1?'disabled':''}>Lock in answer</button>`;}
function mysteryHtml(){const x=mystery[state.sub];return `<div class="meta"><span class="tiny">Mystery player ${state.sub+1} of 2</span><span class="chip">${[10,8,6,4,2][state.level]} pts available</span></div><h2 class="q">Identify the mystery player</h2>${x.clues.slice(0,state.level+1).map((c,i)=>`<div class="clue"><small>Clue ${i+1}</small>${escapeHtml(c)}</div>`).join('')}${state.feedback?`<div class="notice error">${escapeHtml(state.feedback)}</div>`:''}<div class="inputs"><input id="typed" class="field" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="Player’s name"><button class="mini" onclick="handleSubmit()">Lock in</button></div><button class="btn secondary" onclick="reveal()" ${state.level>=4?'disabled':''}>Next clue (−2 pts)</button><button class="btn secondary" onclick="skip()">Skip mystery player →</button>`;}
function oddHtml(){const x=odd[state.sub];return `<div class="meta"><span class="tiny">Puzzle ${state.sub+1} of 3</span><span class="chip">5 pts</span></div><h2 class="q">${escapeHtml(x.q)}</h2><div class="choices">${x.options.map((o,i)=>`<button class="choice ${state.choice===i?'active':''}" onclick="selectChoice(${i})">${String.fromCharCode(65+i)}. ${escapeHtml(o)}</button>`).join('')}</div><button class="btn" onclick="handleSubmit()" ${state.choice===-1?'disabled':''}>Lock in answer</button>`;}
function selectChoice(i){state.choice=i;persist();render();}
function start(){state={mode:'play',round:0,score:[0,0,0,0,0],top:[],wrong:0,step:0,sub:0,level:0,answers:[],choice:-1,feedback:'',timeEnd:Date.now()+maxTime,finished:false,results:[],misses:0};persist();render();}
function logResult(round,label,correct,points){state.results.push({round,label,correct,points});}
function handleSubmit(){if(state.mode!=='play')return;if(remaining()===0){finish(true);return;}let r=state.round;
if(r===0){const inp=document.getElementById('typed'),v=inp.value.trim();if(!v)return;const ix=topNames.findIndex(n=>same(v,n,n==='Andrew Cole'?['Andy Cole']:n==='Sergio Agüero'?['Aguero']:[]));if(ix>=0&&!state.top.includes(ix)){state.top.push(ix);state.score[0]+=3;state.feedback='Correct! +3 points';logResult(0,topNames[ix],true,3);}else if(ix>=0){state.feedback='Already found — try someone else.';}else{state.wrong++;state.feedback='Incorrect guess.';state.misses++;}if(state.top.length===10||state.wrong>=3){nextRound();return;}persist();render();return;}
if(r===1||r===3){const inp=document.getElementById('typed'),v=inp.value.trim();if(!v)return;const x=r===1?trail[state.sub]:mystery[state.sub];if(same(v,x.answer,x.alternatives)){let p=r===1?[6,4,2][state.level]:[10,8,6,4,2][state.level];state.score[r]+=p;logResult(r,x.answer,true,p);state.answers.push(true);advanceQuestion();}else{state.feedback='Not quite. Try another clue or skip (no penalty for this incorrect typed guess).';state.misses++;persist();render();}return;}
if(r===2||r===4){if(state.choice<0)return;const x=r===2?stat[state.sub]:odd[state.sub],correct=state.choice===x.a;state.score[r]+=correct?5:0;logResult(r,x.q,correct,correct?5:0);advanceQuestion();return;}}
function reveal(){state.level=Math.min(state.level+(state.round===1?state.level<2?1:0:state.level<4?1:0),state.round===1?2:4);state.feedback='';persist();render();}
function skip(){const x=state.round===1?trail[state.sub]:mystery[state.sub];logResult(state.round,x.answer,false,0);state.answers.push(false);advanceQuestion();}
function advanceQuestion(){const r=state.round;state.feedback='';state.level=0;state.choice=-1;state.sub++;if((r===1||r===2||r===4)&&state.sub>=3||(r===3&&state.sub>=2)){if(r===1&&state.answers.length===3&&state.answers.every(Boolean))state.score[1]+=2;nextRound();return;}persist();render();}
function nextRound(){if(state.round===0){for(let i=0;i<topNames.length;i++)if(!state.top.includes(i))logResult(0,topNames[i],false,0);}state.round++;state.sub=0;state.level=0;state.choice=-1;state.feedback='';state.answers=[];if(state.round>4){finish(false);return;}persist();render();}
function finish(timedOut){if(state.mode==='done')return;state.mode='done';state.finished=true;state.timedOut=timedOut;persist();render();}
function showResults(){const sum=state.score.reduce((a,b)=>a+b,0);const n=state.top.length+state.results.filter(x=>x.round!==0&&x.correct).length;el.innerHTML=`<section class="box"><div class="kicker">${state.timedOut?'Full-time — clock expired':'Full-time — battle complete'}</div><h1 class="hero">Your final result</h1><div class="score">${sum}<span style="font-size:23px;color:var(--muted)">/100</span></div><p class="lede">${n} out of 21 possible answers · ${sum>=80?'Elite football knowledge!':sum>=55?'Solid performance!':'Time to climb the table.'}</p>${state.score.map((v,i)=>`<div class="resultline"><span>${ROUNDS[i]}</span><b>${v}/${MAX[i]}</b></div>`).join('')}<div class="notice">Full correct answers are not shown in this demo’s results screen, mirroring the planned daily anti-sharing rule. This is a reusable sample game, not today’s live ranked challenge.</div><button class="btn" onclick="share()">Copy shareable score</button><button class="btn secondary" onclick="resetGame()">Play sample again</button></section><section class="box"><div class="kicker">League preview</div><h2>How would your score compare?</h2><p class="lede">A real 20-player league table is coming in a later version. This demo does not invent other players’ scores.</p></section>`;}
function share(){const s=`⚽ FOOTBALL TRIVIA BATTLES\nV0.2 Sample Battle: ${state.score.reduce((a,b)=>a+b,0)}/100\n${ROUNDS.map((r,i)=>`${r}: ${state.score[i]}/${MAX[i]}`).join('\n')}\nThink you can beat me?`;if(navigator.clipboard?.writeText){navigator.clipboard.writeText(s).then(()=>alert('Score copied!')).catch(()=>prompt('Copy your score:',s));}else prompt('Copy your score:',s);}
function resetGame(){try{localStorage.removeItem('ftb_v02')}catch{}state.mode='home';state.timeEnd=null;render();}
load();render();setInterval(renderClock,500);
</script></body></html>

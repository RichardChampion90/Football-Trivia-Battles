<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111c"><title>Football Trivia Battles • V0.3</title><style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f4f7fa;background:#07111c;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100vh}button,input{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}button:disabled{opacity:.42;cursor:not-allowed}.wrap{max-width:620px;margin:0 auto;padding:18px 16px 56px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:12px 0 20px}.brand{font-weight:900;font-size:18px;letter-spacing:.03em}.brand em{font-style:normal;color:#50dba8}.sub,.muted{color:#98aabc}.sub{font-size:12px}.tag{display:inline-block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:#55deb1}.card{background:#111f2d;border:1px solid #294055;border-radius:20px;padding:18px;margin:12px 0}.hero{padding:22px 18px;background:linear-gradient(145deg,#164637,#10263b 75%)}h1{font-size:32px;line-height:1.08;margin:10px 0}h2{font-size:23px;line-height:1.2;margin:10px 0}h3{font-size:17px;margin:0 0 8px}p{line-height:1.5;color:#c9d7df}.btn{border:0;background:#4bdda8;color:#06251b;font-weight:850;border-radius:12px;padding:14px 17px;min-height:49px;width:100%}.btn.alt{background:#20364a;color:#f4f7fa;border:1px solid #35516b}.btn.ghost{background:transparent;color:#b7cbd7;border:1px solid #38536a}.btn.small{min-height:36px;padding:7px 10px;width:auto;font-size:12px}.actions{display:flex;gap:10px;align-items:center;margin:16px 0}.actions>*{flex:1}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{padding:14px 6px;text-align:center;background:#0b1824;border-radius:12px}.stat b{display:block;font-size:23px}.stat span{font-size:11px;color:#a9baca}.rule{padding:11px 0;border-bottom:1px solid #273c4d;display:flex;justify-content:space-between;gap:10px}.rule:last-child{border:0}.roundhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.progress{display:flex;gap:5px;margin:16px 0}.progress span{height:7px;background:#344c5b;flex:1;border-radius:10px}.progress .done{background:#4bdda8}.progress .active{background:#e9bd60}.clock{background:#243547;border-radius:10px;padding:8px 10px;font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap}.clock.danger{background:#542c32;color:#ffacac}.label{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:#9cb4c2;font-weight:800}.inputrow{display:flex;gap:8px;margin:13px 0}input{width:100%;min-width:0;background:#081722;border:1px solid #476477;color:#fff;padding:14px 12px;border-radius:12px;outline-offset:1px}input:focus{border-color:#4bdda8}inputrow button{width:auto;flex-shrink:0}.hint{font-size:13px;color:#b6c8d5;margin-top:4px}.listrow{display:flex;align-items:center;gap:10px;padding:10px 11px;border-radius:12px;background:#0a1925;margin:5px 0;min-height:47px}.num{font-size:12px;color:#96b0c1;width:22px}.grow{flex:1}.got{color:#5cdaa8;font-weight:800}.revealed{color:#d1d7dc}.notice{padding:12px;background:#1b3340;border-radius:11px;margin:12px 0;color:#c5e7ed;font-size:14px}.success{background:#173d34;color:#8df3c6}.fail{background:#412b31;color:#ffccd0}.badges{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:16px 0}.club{display:flex;flex-direction:column;align-items:center;width:76px;gap:6px}.crest{width:59px;height:68px;clip-path:polygon(10% 0,90% 0,100% 15%,94% 75%,50% 100%,6% 75%,0 15%);display:flex;align-items:center;justify-content:center;border:3px solid #eee;color:white;font-size:15px;font-weight:1000;text-shadow:0 1px 3px #0008;box-shadow:inset 0 0 0 4px #ffffff33}.club span{font-size:10px;color:#d9e6ea;text-align:center;line-height:1.25}.option{width:100%;display:block;text-align:left;border:1px solid #35556d;background:#0b1a29;color:white;border-radius:12px;padding:14px;margin:8px 0}.option.selected{border-color:#4bdda8;background:#163e37}.option.correct{border-color:#53e0a8;background:#164539}.option.wrong{border-color:#ea8585;background:#472d36}.point{display:inline-block;border-radius:8px;padding:4px 8px;font-size:12px;font-weight:800;background:#274439;color:#99f4c1}.tiny{font-size:12px;color:#99aeba}.flex{display:flex;justify-content:space-between;align-items:center;gap:10px}.scorebig{font-size:52px;line-height:1;font-weight:1000;margin:20px 0 5px}.hide{display:none}.warning{color:#ffb8a6}footer{text-align:center;font-size:11px;color:#738b9d;margin-top:24px}.section{margin:22px 0}.chip{padding:8px 10px;background:#203749;border-radius:9px;color:#c5dfe7;font-size:12px}.source a{color:#9addd1}.introRows{font-size:13px}.introRows strong{color:white}
</style></head><body><main class="wrap"><header class="top"><div><div class="brand">⚽ FOOTBALL <em>TRIVIA BATTLES</em></div><div class="sub">V0.3 · Mobile gameplay prototype</div></div><div id="clock" class="clock hide">10:00</div></header><div id="app"></div><footer>Prototype only · The league is not yet live · No account or payment required</footer></main><script>
'use strict';
const ROUND_NAMES=['Top Ten','Club Journey','Stat Attack','Mystery Player','Odd One Out'];
const MAX=[30,20,15,20,15], TOTAL=100, DURATION=600000, KEY='ftb-v03-demo-state';
const topTen=[
{name:'Alan Shearer',aliases:['shearer'],country:'England',club:'Blackburn / Newcastle'},
{name:'Harry Kane',aliases:['kane'],country:'England',club:'Tottenham'},
{name:'Wayne Rooney',aliases:['rooney'],country:'England',club:'Everton / Man United'},
{name:'Mohamed Salah',aliases:['salah','mo salah'],country:'Egypt',club:'Chelsea / Liverpool'},
{name:'Andrew Cole',aliases:['andy cole','cole'],country:'England',club:'Newcastle / Man United'},
{name:'Sergio Agüero',aliases:['aguero','sergio aguero'],country:'Argentina',club:'Man City'},
{name:'Frank Lampard',aliases:['lampard'],country:'England',club:'West Ham / Chelsea'},
{name:'Thierry Henry',aliases:['henry'],country:'France',club:'Arsenal'},
{name:'Robbie Fowler',aliases:['fowler'],country:'England',club:'Liverpool / Man City'},
{name:'Jermain Defoe',aliases:['defoe'],country:'England',club:'West Ham / Tottenham'}];
const clubs={
'Lille':['LOSC','#b32429'],'Chelsea':['CFC','#1452b4'],'Real Madrid':['RMCF','#b7a172'],
'Genk':['KRC','#1572b5'],'Werder Bremen':['SVW','#19865f'],'Wolfsburg':['VfL','#65a62e'],'Man City':['MCFC','#5aaed4'],
'Basel':['FCB','#b71e32'],'Fiorentina':['ACF','#66398a'],'Roma':['ASR','#ab3f30'],'Liverpool':['LFC','#bd2434'],
'Atletico Madrid':['ATM','#c73340'],'Ajax':['AFC','#a8292d']};
const journeys=[
{answer:'Eden Hazard',aliases:['hazard'],clubs:['Lille','Chelsea','Real Madrid'],note:'Senior permanent clubs in order.'},
{answer:'Kevin De Bruyne',aliases:['de bruyne','kdb'],clubs:['Genk','Chelsea','Werder Bremen','Wolfsburg','Man City'],note:'Includes his Werder Bremen loan.'},
{answer:'Mohamed Salah',aliases:['salah','mo salah'],clubs:['Basel','Chelsea','Fiorentina','Roma','Liverpool'],note:'Includes his Fiorentina and Roma loans.'}
];
const stats=[
{q:'Who has more career Premier League goals?',options:['Didier Drogba','Robin van Persie','Same number','Neither reached 100'],correct:1,reason:'Van Persie scored 144 Premier League goals; Drogba scored 104.'},
{q:'Who won the 2015/16 Premier League Golden Boot?',options:['Sergio Agüero','Jamie Vardy','Harry Kane','Romelu Lukaku'],correct:2,reason:'Harry Kane finished the season with 25 league goals.'},
{q:'Which season saw Mohamed Salah score 32 Premier League goals?',options:['2016/17','2017/18','2018/19','2019/20'],correct:1,reason:'Salah scored 32 in 2017/18.'}
];
const mysteries=[
{answer:'James Milner',aliases:['milner'],clues:['I won Premier League titles with two different clubs.','I represented England and played club football in England throughout my senior career.','I played for Manchester City and Liverpool.','My first name is James.','My surname starts with M.']},
{answer:'N’Golo Kanté',aliases:['ngolo kante','kante','n golo kante'],clues:['I won the Premier League with two different clubs in consecutive seasons.','I was part of a World Cup-winning national team.','I played for Leicester City and Chelsea.','I am a French defensive midfielder.','My surname begins with K.']}
];
const odds=[
{q:'Which player never won the Premier League Golden Boot?',options:['Didier Drogba','Carlos Tevez','Eden Hazard','Nicolas Anelka'],correct:2,reason:'Drogba, Tevez and Anelka won the award; Hazard did not.'},
{q:'Which of these clubs has NOT won the Premier League title?',options:['Blackburn Rovers','Leicester City','Newcastle United','Liverpool'],correct:2,reason:'Newcastle have never won the Premier League era title.'},
{q:'Which player did NOT win the Premier League title with Chelsea?',options:['Juan Mata','Cesc Fàbregas','Nemanja Matić','Fernando Torres'],correct:3,reason:'Torres left Chelsea in 2014, before their 2014/15 league title.'}
];
const $=s=>document.querySelector(s), app=$('#app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[’']/g,'').replace(/[^a-z0-9]/g,'');
const matches=(value,obj)=>[obj.answer||obj.name,...(obj.aliases||[])].some(x=>norm(value)===norm(x));
const initial=()=>({mode:'home',round:0,started:0,finished:0,score:[0,0,0,0,0],topFound:[],topMistakes:0,topHints:[],journeyIndex:0,journeyDone:[],statIndex:0,statDone:[],mysteryIndex:0,mysteryClues:[0,0],mysteryDone:[],oddIndex:0,oddDone:[],input:'',selected:-1,feedback:''});
let S=initial(); try{let saved=JSON.parse(localStorage.getItem(KEY));if(saved&&saved.version===3&&saved.data)S={...initial(),...saved.data}}catch(e){};
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify({version:3,data:S}))}catch(e){}};
const left=()=>Math.max(0,DURATION-(Date.now()-S.started));
const pts=()=>S.score.reduce((a,b)=>a+b,0);
function finish(){if(S.mode!=='play')return;S.mode='done';S.finished=Date.now();persist();render()}
function tick(){let c=$('#clock');if(S.mode==='play'&&S.started){let r=left();if(r<=0){finish();return}if(c){c.classList.remove('hide');c.classList.toggle('danger',r<60000);c.textContent=`${String(Math.floor(r/60000)).padStart(2,'0')}:${String(Math.floor((r%60000)/1000)).padStart(2,'0')}`}}else if(c)c.classList.add('hide')}
const progress=()=>`<div class="progress">${ROUND_NAMES.map((n,i)=>`<span class="${S.round>i?'done':S.round===i?'active':''}"></span>`).join('')}</div>`;
const header=(subtitle)=>`<div class="roundhead"><div><div class="tag">Round ${S.round+1} of 5</div><h2>${ROUND_NAMES[S.round]}</h2><div class="sub">${subtitle}</div></div><span class="point">${S.score[S.round]}/${MAX[S.round]} pts</span></div>${progress()}`;
const submit=label=>`<button class="btn" onclick="submitAnswer()">${label||'Lock in answer'}</button>`;
function render(){let html='';if(S.mode==='home'){html=`<div class="card hero"><div class="tag">FRIDAY NIGHT TEST BUILD · V0.3</div><h1>Know your football.<br>Prove it.</h1><p>Five rounds. Twenty-one answers. One score to beat. Refined following the first player test.</p><div class="stats"><div class="stat"><b>5</b><span>Rounds</span></div><div class="stat"><b>21</b><span>Answers</span></div><div class="stat"><b>10:00</b><span>Minutes</span></div></div><div class="actions"><button class="btn" onclick="start()">Start practice battle →</button></div><div class="tiny">Timer runs continuously after starting. Practice scores are stored on this phone only.</div></div><div class="card"><h3>The new format</h3>${ROUND_NAMES.map((x,i)=>`<div class="rule"><span>${i+1}. ${x}</span><strong>${MAX[i]} pts</strong></div>`).join('')}</div><div class="notice">Club Journey uses <b>illustrative shield badges with club initials</b> for now. Before public launch, we'll source cleared crest assets.</div>`}
else if(S.mode==='done'){html=`<div class="card hero"><div class="tag">FINAL WHISTLE</div><div class="scorebig">${pts()}<span style="font-size:25px;color:#a8c2ca">/100</span></div><h2>${pts()>=85?'Champions League class!':pts()>=65?'Solid performance!':pts()>=45?'Good battle — room to improve!':'Plenty to build on!'}</h2><p>Five rounds completed${S.finished&&S.started?' · '+Math.min(10,Math.ceil((S.finished-S.started)/60000))+' minutes played':''}.</p></div><div class="card"><h3>Round breakdown</h3>${ROUND_NAMES.map((name,i)=>`<div class="rule"><span>${name}</span><strong>${S.score[i]}/${MAX[i]}</strong></div>`).join('')}</div><div class="card"><h3>Review your answers</h3><p>Top Ten: ${topTen.map(x=>esc(x.name)).join(', ')}.</p><p>Club Journey: ${journeys.map(x=>esc(x.answer)).join(', ')}.</p><p>Mystery players: ${mysteries.map(x=>esc(x.answer)).join(' and ')}.</p><div class="source tiny">Top Ten benchmark: <a href="https://theanalyst.com/articles/premier-league-all-time-top-goalscorers" target="_blank" rel="noopener">Opta Analyst ranking</a> (May 2026). Other sample facts should undergo editorial checks before ranked publication.</div></div><div class="actions"><button class="btn" onclick="shareScore()">Copy my score</button><button class="btn alt" onclick="resetBattle()">New practice attempt</button></div>`}
else if(S.mode==='play'){html=header(['Name 10 all-time Premier League scorers. Hint options make this fairer.','All club shields are visible immediately. Name the player.','Three trickier multiple-choice stats.','Two footballers, with meaningful clues.','Three less-obvious odd ones out.'][S.round]);if(S.round===0)html+=renderTop();if(S.round===1)html+=renderJourney();if(S.round===2)html+=renderMulti(stats,S.statIndex,S.statDone);if(S.round===3)html+=renderMystery();if(S.round===4)html+=renderMulti(odds,S.oddIndex,S.oddDone);}
app.innerHTML=html;tick();}
function start(){S=initial();S.mode='play';S.started=Date.now();persist();render()}
function resetBattle(){if(!confirm('Start a fresh practice battle and erase this demo score?'))return;S=initial();persist();render()}
function next(){S.input='';S.selected=-1;S.feedback='';S.round++;if(S.round>=5){finish();return}persist();render()}
function endRound(){if(S.round===4){finish()}else next()}
function renderTop(){const done=S.topFound.length>=10||S.topMistakes>=3;return `<div class="card"><div class="label">All-time Premier League scorers</div><h3>Find the top ten (through 2025/26)</h3><p class="tiny">3 points each. You can make 3 incorrect guesses. Tap a hint beside a rank for its club and nationality (costs 1 point if you find that player).</p><div class="flex"><strong>${S.topFound.length}/10 found</strong><span class="chip">${3-S.topMistakes} incorrect guesses remaining</span></div>${topTen.map((a,i)=>{let found=S.topFound.includes(i),hint=S.topHints.includes(i);return `<div class="listrow"><span class="num">${i+1}</span><span class="grow ${found?'got':''}">${found?esc(a.name):hint?esc(a.club+' · '+a.country):'••••••••••••••'}</span>${!found&&!done?`<button class="btn small alt" onclick="topHint(${i})" ${hint?'disabled':''}>${hint?'Hint used':'Hint −1'}</button>`:''}${found?`<span class="point">+${hint?2:3}</span>`:''}</div>`}).join('')}${!done?`<form class="inputrow" onsubmit="event.preventDefault();submitTop()"><input id="guess" autocomplete="off" autocapitalize="words" spellcheck="false" placeholder="Player name…" aria-label="Enter a player name"><button class="btn" type="submit">Guess</button></form>`:''}${S.feedback?`<div class="notice ${S.feedback.startsWith('Correct')?'success':'fail'}">${esc(S.feedback)}</div>`:''}${done?`<div class="notice success">${S.topFound.length===10?'Perfect ten!':'Three misses — Top Ten finished.'}</div>`:''}<button class="btn alt" onclick="next()">${done?'Continue to Club Journey':'Finish round and continue'} →</button></div>`}
function topHint(i){if(S.topHints.includes(i)||S.topFound.includes(i))return;S.topHints.push(i);persist();render()}
function submitTop(){let input=$('#guess')?.value.trim();if(!input)return;let i=topTen.findIndex(a=>matches(input,a));if(i<0){S.topMistakes++;S.feedback='Not in this Top Ten. '+(3-S.topMistakes)+' misses left.'}else if(S.topFound.includes(i))S.feedback='Already found — try another name.';else{S.topFound.push(i);S.score[0]+=S.topHints.includes(i)?2:3;S.feedback='Correct! '+topTen[i].name+' is #'+(i+1)+'.'}persist();render()}
function clubHTML(name){let [initial,color]=clubs[name]||[name.slice(0,3),'#465'];return `<div class="club"><div class="crest" style="background:${esc(color)}" aria-label="${esc(name)} badge placeholder">${esc(initial)}</div><span>${esc(name)}</span></div>`}
function renderJourney(){let i=S.journeyIndex;if(i>=3)return `<div class="card"><h3>All journeys completed</h3><p>Club Journey score: ${S.score[1]}/20.</p><button class="btn" onclick="next()">Continue to Stat Attack →</button></div>`;let q=journeys[i],done=S.journeyDone[i];return `<div class="card"><div class="flex"><span class="label">Player ${i+1} of 3</span><span class="point">${[7,7,6][i]} pts</span></div><h3>Who played for these clubs, in this order?</h3><p class="tiny">${esc(q.note)} These are labelled shield placeholders, not official crests.</p><div class="badges">${q.clubs.map(clubHTML).join('')}</div>${done?`<div class="notice ${done.correct?'success':'fail'}">${done.correct?'Correct!':'Answer:'} ${esc(q.answer)}</div><button class="btn" onclick="advanceJourney()">${i===2?'Finish round':'Next journey'} →</button>`:`<form class="inputrow" onsubmit="event.preventDefault();submitJourney()"><input id="guess" placeholder="Player's name…" autocomplete="off" autocapitalize="words" spellcheck="false" aria-label="Player name"><button class="btn" type="submit">Lock in</button></form><p class="tiny">One locked guess for each career path.</p>`}</div>`}
function submitJourney(){let v=$('#guess')?.value.trim();if(!v)return;let i=S.journeyIndex,q=journeys[i];let correct=matches(v,q);S.journeyDone[i]={correct,guess:v};if(correct)S.score[1]+=[7,7,6][i];persist();render()}
function advanceJourney(){S.journeyIndex++;persist();render()}
function renderMulti(bank,i,done){let round=S.round;if(i>=3)return `<div class="card"><h3>Round complete</h3><p>You earned ${S.score[round]}/${MAX[round]} points.</p><button class="btn" onclick="next()">${round===2?'Continue to Mystery Player':'See final result'} →</button></div>`;let q=bank[i],locked=done[i];return `<div class="card"><div class="flex"><span class="label">Question ${i+1} of 3</span><span class="point">5 pts</span></div><h3>${esc(q.q)}</h3>${q.options.map((opt,k)=>`<button class="option ${locked?(k===q.correct?'correct':locked.choice===k?'wrong':''):S.selected===k?'selected':''}" onclick="choose(${k})" ${locked?'disabled':''}>${String.fromCharCode(65+k)}. ${esc(opt)}</button>`).join('')}${locked?`<div class="notice ${locked.correct?'success':'fail'}">${locked.correct?'Correct! +5':'No points this time.'} ${esc(q.reason)}</div><button class="btn" onclick="advanceMulti()">${i===2?'Finish round':'Next question'} →</button>`:`<button class="btn" onclick="submitAnswer()" ${S.selected<0?'disabled':''}>Lock in answer</button>`}</div>`}
function choose(i){if(S.mode!=='play')return;S.selected=i;persist();render()}
function submitAnswer(){if(S.selected<0)return;let isStat=S.round===2,bank=isStat?stats:odds,i=isStat?S.statIndex:S.oddIndex,record=isStat?S.statDone:S.oddDone,q=bank[i];if(record[i])return;let correct=S.selected===q.correct;record[i]={correct,choice:S.selected};if(correct)S.score[S.round]+=5;persist();render()}
function advanceMulti(){if(S.round===2)S.statIndex++;else S.oddIndex++;S.selected=-1;persist();render()}
function renderMystery(){let i=S.mysteryIndex;if(i>=2)return `<div class="card"><h3>Both mystery players completed</h3><p>You earned ${S.score[3]}/20.</p><button class="btn" onclick="next()">Continue to Odd One Out →</button></div>`;let q=mysteries[i],level=S.mysteryClues[i],done=S.mysteryDone[i],value=[10,8,6,4,2][level];return `<div class="card"><div class="flex"><span class="label">Mystery ${i+1} of 2</span><span class="point">Up to ${value} pts</span></div><h3>Who am I?</h3>${q.clues.slice(0,level+1).map((t,k)=>`<div class="listrow" style="align-items:flex-start"><span class="num">${k+1}</span><span class="grow">${esc(t)}</span></div>`).join('')}${done?`<div class="notice ${done.correct?'success':'fail'}">${done.correct?'Brilliant! +'+done.points+' points':'Answer: '+q.answer}</div><button class="btn" onclick="advanceMystery()">${i===1?'Finish round':'Next mystery player'} →</button>`:`<form class="inputrow" onsubmit="event.preventDefault();submitMystery()"><input id="guess" placeholder="Player's name…" autocomplete="off" autocapitalize="words" spellcheck="false" aria-label="Mystery player name"><button class="btn" type="submit">Lock in</button></form><button class="btn alt" onclick="moreClue()" ${level>=4?'disabled':''}>${level<4?'Reveal another clue (−2 pts)':'All clues revealed'}</button><p class="tiny">A wrong locked guess scores zero for this player. You can request more clues before answering.</p>`}</div>`}
function moreClue(){let i=S.mysteryIndex;if(S.mysteryClues[i]<4)S.mysteryClues[i]++;persist();render()}
function submitMystery(){let v=$('#guess')?.value.trim();if(!v)return;let i=S.mysteryIndex,q=mysteries[i],correct=matches(v,q),points=correct?[10,8,6,4,2][S.mysteryClues[i]]:0;S.mysteryDone[i]={correct,points,guess:v};S.score[3]+=points;persist();render()}
function advanceMystery(){S.mysteryIndex++;persist();render()}
function shareScore(){let text=`⚽ Football Trivia Battles V0.3\n${pts()}/100\n${ROUND_NAMES.map((x,i)=>x+': '+S.score[i]+'/'+MAX[i]).join('\n')}\nCan you beat me?`;if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(()=>alert('Score copied!')).catch(()=>prompt('Copy your score:',text));else prompt('Copy your score:',text)}
setInterval(tick,500);render();
</script></body></html>

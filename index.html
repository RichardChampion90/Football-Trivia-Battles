function next(){S.input='';S.selected=-1;S.feedback='';S.round++;if(S.round>=5){finish();return}persist();render()}
function endRound(){if(S.round===4){finish()}else next()}
function renderTop(){const done=S.topFound.length>=10||S.topMistakes>=3;return `<div class="card"><div class="label">${esc(PACKS.find(p=>p.id===activePack).topTitle)}</div><h3>Find the ten ranked entries</h3><p class="tiny">3 points each. You can make 3 incorrect guesses. Tap a hint beside a rank for an extra detail (costs 1 point if you find that entry).</p><div class="flex"><strong>${S.topFound.length}/10 found</strong><span class="chip">${3-S.topMistakes} incorrect guesses remaining</span></div><div class="topGrid">${topTen.map((a,i)=>{let found=S.topFound.includes(i),hint=S.topHints.includes(i);return `<div class="listrow"><span class="num">${i+1}</span><span class="grow ${found?'got':''}">${found?esc(a.name):hint?esc(a.club+' · '+a.country):'••••••••••••••'}</span>${!found&&!done?`<button class="btn small alt" onclick="topHint(${i})" ${hint?'disabled':''}>${hint?'Hint used':'Hint −1'}</button>`:''}${found?`<span class="point">+${hint?2:3}</span>`:''}</div>`}).join('')}</div>${!done?`<form class="inputrow" onsubmit="event.preventDefault();submitTop()"><input id="guess" autocomplete="off" autocapitalize="words" spellcheck="false" placeholder="Player name…" aria-label="Enter a player name"><button class="btn" type="submit">Guess</button></form>`:''}${S.feedback?`<div class="notice ${S.feedback.startsWith('Correct')?'success':'fail'}">${esc(S.feedback)}</div>`:''}${done?`<div class="notice success">${S.topFound.length===10?'Perfect ten!':'Three misses — Top Ten finished.'}</div>`:''}<button class="btn alt" onclick="next()">${done?'Continue to Club Journey':'Finish round and continue'} →</button></div>`}
function topHint(i){if(S.topHints.includes(i)||S.topFound.includes(i))return;S.topHints.push(i);persist();render()}
function submitTop(){let input=$('#guess')?.value.trim();if(!input)return;let i=topTen.findIndex(a=>matches(input,a));if(i<0){S.topMistakes++;S.feedback='Not in this Top Ten. '+(3-S.topMistakes)+' misses left.'}else if(S.topFound.includes(i))S.feedback='Already found — try another name.';else{S.topFound.push(i);S.score[0]+=S.topHints.includes(i)?2:3;S.feedback='Correct! '+topTen[i].name+' is #'+(i+1)+'.'}persist();render()}
function clubHTML(name){let [initial,color]=clubs[name]||[name.slice(0,3),'#465'];return `<div class="club"><div class="crest" style="background:${esc(color)}" aria-label="${esc(name)} badge placeholder">${esc(initial)}</div><span>${esc(name)}</span></div>`}
function renderJourney(){let i=S.journeyIndex;if(i>=3)return `<div class="card"><h3>All journeys completed</h3><p>Club Journey score: ${S.score[1]}/20.</p><button class="btn" onclick="next()">Continue to Stat Attack →</button></div>`;let q=journeys[i],done=S.journeyDone[i];return `<div class="card"><div class="flex"><span class="label">Player ${i+1} of 3</span><span class="point">${[7,7,6][i]} pts</span></div><h3>Who played for these clubs, in this order?</h3><p class="tiny">${esc(q.note)} These are labelled shield placeholders, not official crests.</p><div class="badges">${q.clubs.map(clubHTML).join('')}</div>${done?`<div class="notice ${done.correct?'success':'fail'}">${done.correct?'Correct!':'Answer:'} ${esc(q.answer)}</div><button class="btn" onclick="advanceJourney()">${i===2?'Finish round':'Next journey'} →</button>`:`<form class="inputrow" onsubmit="event.preventDefault();submitJourney()"><input id="guess" placeholder="Player's name…" autocomplete="off" autocapitalize="words" spellcheck="false" aria-label="Player name"><button class="btn" type="submit">Lock in</button></form><p class="tiny">One locked guess for each career path.</p>`}</div>`}
function submitJourney(){let v=$('#guess')?.value.trim();if(!v)return;let i=S.journeyIndex,q=journeys[i];let correct=matches(v,q);S.journeyDone[i]={correct,guess:v};if(correct)S.score[1]+=[7,7,6][i];persist();render()}
function advanceJourney(){S.journeyIndex++;persist();render()}
function renderMulti(bank,i,done){let round=S.round;if(i>=3)return `<div class="card"><h3>Round complete</h3><p>You earned ${S.score[round]}/${MAX[round]} points.</p><button class="btn" onclick="next()">${round===2?'Continue to Mystery Player':'See final result'} →</button></div>`;let q=bank[i],locked=done[i];return `<div class="card"><div class="flex"><span class="label">Question ${i+1} of 3</span><span class="point">5 pts</span></div><h3>${esc(q.q)}</h3>${q.options.map((opt,k)=>`<button class="option ${locked?(k===q.correct?'correct':locked.choice===k?'wrong':''):S.selected===k?'selected':''}" onclick="choose(${k})" ${locked?'disabled':''}>${String.fromCharCode(65+k)}. ${esc(opt)}</button>`).join('')}${locked?`<div class="notice ${locked.correct?'success':'fail'}">${locked.correct?'Correct! +5':'No points this time.'} ${esc(q.reason)}</div><button class="btn" onclick="advanceMulti()">${i===2?'Finish round':'Next question'} →</button>`:`<button class="btn" onclick="submitAnswer()" ${S.selected<0?'disabled':''}>Lock in answer</button>`}</div>`}
function choose(i){if(S.mode!=='play')return;S.selected=i;persist();render()}
function submitAnswer(){if(S.selected<0)return;let isStat=S.round===2,bank=isStat?stats:odds,i=isStat?S.statIndex:S.oddIndex,record=isStat?S.statDone:S.oddDone,q=bank[i];if(record[i])return;let correct=S.selected===q.correct;record[i]={correct,choice:S.selected};if(correct)S.score[S.round]+=5;persist();render()}
function advanceMulti(){if(S.round===2)S.statIndex++;else S.oddIndex++;S.selected=-1;persist();render()}
function renderMystery(){let i=S.mysteryIndex;if(i>=2)return `<div class="card"><h3>Both mystery players completed</h3><p>You earned ${S.score[3]}/20.</p><button class="btn" onclick="next()">Continue to Odd One Out →</button></div>`;let q=mysteries[i],level=S.mysteryClues[i],done=S.mysteryDone[i],value=[10,8,6,4,2][level];return `<div class="card"><div class="flex"><span class="label">Mystery ${i+1} of 2</span><span class="point">Up to ${value} pts</span></div><h3>Who am I?</h3>${q.clues.slice(0,level+1).map((t,k)=>`<div class="listrow" style="align-items:flex-start"><span class="num">${k+1}</span><span class="grow">${esc(t)}</span></div>`).join('')}${done?`<div class="notice ${done.correct?'success':'fail'}">${done.correct?'Brilliant! +'+done.points+' points':'Answer: '+q.answer}</div><button class="btn" onclick="advanceMystery()">${i===1?'Finish round':'Next mystery player'} →</button>`:`<form class="inputrow" onsubmit="event.preventDefault();submitMystery()"><input id="guess" placeholder="Player's name…" autocomplete="off" autocapitalize="words" spellcheck="false" aria-label="Mystery player name"><button class="btn" type="submit">Lock in</button></form><button class="btn alt" onclick="moreClue()" ${level>=4?'disabled':''}>${level<4?'Reveal another clue (−2 pts)':'All clues revealed'}</button><p class="tiny">A wrong locked guess scores zero for this player. You can request more clues before answering.</p>`}</div>`}
function moreClue(){let i=S.mysteryIndex;if(S.mysteryClues[i]<4)S.mysteryClues[i]++;persist();render()}
function submitMystery(){let v=$('#guess')?.value.trim();if(!v)return;let i=S.mysteryIndex,q=mysteries[i],correct=matches(v,q),points=correct?[10,8,6,4,2][S.mysteryClues[i]]:0;S.mysteryDone[i]={correct,points,guess:v};S.score[3]+=points;persist();render()}
function advanceMystery(){S.mysteryIndex++;persist();render()}
function shareScore(){let text=`⚽ Football Trivia Battles V0.4\n${pts()}/100\n${ROUND_NAMES.map((x,i)=>x+': '+S.score[i]+'/'+MAX[i]).join('\n')}\nCan you beat me?`;if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(()=>alert('Score copied!')).catch(()=>prompt('Copy your score:',text));else prompt('Copy your score:',text)}
setInterval(tick,500);render();
</script></body></html>
